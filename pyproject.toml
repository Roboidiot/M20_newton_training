[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "M20_newton_training"
version = "0.1.0"
description = "Isaac Lab environments for M20_newton_training."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Isaac Lab Project Developers" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab-dev[rsl-rl]",
    # Open3D 0.19 wheels require widgets; its index metadata omits this dependency.
    "ipywidgets>=8.0.4; python_version < '3.13' and (sys_platform != 'linux' or platform_machine != 'aarch64')",
]

[project.entry-points."isaaclab.tasks"]
"M20_newton_training" = "M20_newton_training.tasks"

[project.optional-dependencies]
all = ["isaaclab-dev[all]"]
dev = ["isaaclab-dev[dev]"]
importers = ["isaaclab-dev[importers]"]
isaacsim = ["isaaclab-dev[isaacsim]"]
leapp = ["isaaclab-dev[leapp]"]
mimic = ["isaaclab-dev[mimic]"]
ov = ["isaaclab-dev[ov]"]
ovphysx = ["isaaclab-dev[ovphysx]"]
ovrtx = ["isaaclab-dev[ovrtx]"]
rerun = ["isaaclab-dev[rerun]"]
rl-games = ["isaaclab-dev[rl-games]"]
rlinf = ["isaaclab-dev[rlinf]"]
rsl-rl = ["isaaclab-dev[rsl-rl]"]
sb3 = ["isaaclab-dev[sb3]"]
skrl = ["isaaclab-dev[skrl]"]
skrl-jax = ["isaaclab-dev[skrl-jax]"]
teleop = ["isaaclab-dev[teleop]"]
test = ["isaaclab-dev[test]"]
tetrahedralization = ["isaaclab-dev[tetrahedralization]"]
torchrl = ["isaaclab-dev[torchrl]"]
video = ["isaaclab-dev[video]"]
viser = ["isaaclab-dev[viser]"]
wandb = ["isaaclab-dev[wandb]"]

[dependency-groups]
dev = ["codespell>=2.4", "pre-commit>=4.2", "pytest>=8.3", "ruff>=0.11"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
override-dependencies = [
    # Numba 0.64 needs <2.5; the cmeel-boost 1.89 wheel needs <2.4.
    "numpy>=2,<2.4",
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    # Force the Newton-matched schemas over isaacsim's ==0.2.0 pin.
    "newton-usd-schemas>=0.5.0",
    # isaacsim-asset-isolated and isaacsim-robot-schema 6.2 pin usd-exchange ==2.3.0.
    "usd-exchange==3.0.1",
    # usd-optimize must share usd-exchange's OpenUSD build (26.08); bump the two together.
    "usd-optimize~=1.3.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    # isaacsim-core 6.2 pins fsspec 2026.2.0, while torch 2.11 requires 2026.6.0.
    "fsspec>=2026.6.0",
    # ovphysx caps packaging at <24 and isaacsim-core pins ==26.0; both caps are
    # stricter than the code needs, so widening lets them resolve together at 26.0.
    "packaging>=20,<27",
    # isaacsim-kernel 6.2 pins the urllib3 release affected by GHSA-vxq7-64xx-v4gw.
    "urllib3>=2.8.0",
]

[tool.uv.sources]
"isaaclab" = { path = "../../../Newton/IsaacLab/source/isaaclab", editable = true }
"isaaclab-assets" = { path = "../../../Newton/IsaacLab/source/isaaclab_assets", editable = true }
"isaaclab-contrib" = { path = "../../../Newton/IsaacLab/source/isaaclab_contrib", editable = true }
"isaaclab-dev" = { path = "../../../Newton/IsaacLab", editable = true }
"isaaclab-experimental" = { path = "../../../Newton/IsaacLab/source/isaaclab_experimental", editable = true }
"isaaclab-mimic" = { path = "../../../Newton/IsaacLab/source/isaaclab_mimic", editable = true }
"isaaclab-newton" = { path = "../../../Newton/IsaacLab/source/isaaclab_newton", editable = true }
"isaaclab-ov" = { path = "../../../Newton/IsaacLab/source/isaaclab_ov", editable = true }
"isaaclab-physx" = { path = "../../../Newton/IsaacLab/source/isaaclab_physx", editable = true }
"isaaclab-ppisp" = { path = "../../../Newton/IsaacLab/source/isaaclab_ppisp", editable = true }
"isaaclab-rl" = { path = "../../../Newton/IsaacLab/source/isaaclab_rl", editable = true }
"isaaclab-tasks" = { path = "../../../Newton/IsaacLab/source/isaaclab_tasks", editable = true }
"isaaclab-tasks-experimental" = { path = "../../../Newton/IsaacLab/source/isaaclab_tasks_experimental", editable = true }
"isaaclab-teleop" = { path = "../../../Newton/IsaacLab/source/isaaclab_teleop", editable = true }
"isaaclab-visualizers" = { path = "../../../Newton/IsaacLab/source/isaaclab_visualizers", editable = true }
"omniverseclient" = { index = "pypi-public" }
"ovphysx" = { index = "pypi-public" }
"ovrtx" = { index = "pypi-public" }
"ovstage" = { index = "pypi-public" }
"torch" = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }, { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }, { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
"torchvision" = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }, { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }, { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]

[tool.uv.build-backend]
module-name = "M20_newton_training"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["M20_newton_training"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "isaaclab",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-assets",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
isaaclab = ["isaaclab", "isaaclab_newton", "isaaclab_ov", "isaaclab_physx"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-tasks" = ["isaaclab_tasks"]
"isaaclab-assets" = ["isaaclab_assets"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"**/__init__.pyi" = ["F401", "F403"]
"scripts/**/*.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "scripts", "tests", "mojuco_sim"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
stubPath = "typings"
exclude = ["**/__pycache__", "**/logs", ".git", ".venv", ".vscode"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: test exercises isolated logic and does not launch the simulator",
    "integration: test drives the simulator/scene/environment end-to-end",
    "smoke: tests for core installation, task, and RL functionality",
    "kitless: test must pass inside the Kit-less container, which has no Isaac Sim runtime",
]

[tool.codespell]
skip = "*.usd,*.usda,*.usdc,*.json,*.onnx,*.pt,*.mp4,*.data,uv.lock,logs"

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

